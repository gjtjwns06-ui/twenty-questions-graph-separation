name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-exact-witnesses:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: research/requirements-lock.txt
      - name: Verify preserved research, archives and documentation links
        run: python scripts/verify_release.py
      - name: Install the recorded dependencies
        run: python -m pip install -r research/requirements-lock.txt
      - name: Reproduce the original witness
        working-directory: research
        run: python verify_witness.py --output verification_ci.json
      - name: Run solver and research invariance checks
        working-directory: research
        run: python -m unittest discover -s tests -v
      - name: Independently average the finite witness greedy ties
        run: python scripts/verify_finite38.py
